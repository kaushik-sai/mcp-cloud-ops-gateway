# gitleaks configuration for the secret-scan job and for local runs.
# Extends the built-in rule set; only the paths below are allowed, nothing else.
title = "mcp-cloud-ops-gateway"

[extend]
useDefault = true

[[allowlists]]
description = "Redaction tests and fixtures hold fake credentials on purpose"
paths = [
  '''internal/.*_test\.go''',
  '''(^|/)testdata/.*''',
]
