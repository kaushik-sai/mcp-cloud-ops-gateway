apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-cloud-ops-gateway
spec:
  # Exactly one replica: pending approvals are held in memory, so a second replica
  # would not see approvals made against the first. Recreate avoids two pods overlapping.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-cloud-ops-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-cloud-ops-gateway
    spec:
      serviceAccountName: mcp-gateway
      automountServiceAccountToken: true   # kubectl in_cluster credentials need it
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Pin by digest in real use; set via `kustomize edit set image`.
          image: mcp-cloud-ops-gateway:dev
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/mcp-gateway/gateway.yaml"]
          ports:
            - { name: mcp, containerPort: 8080 }
            - { name: admin, containerPort: 8081 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/mcp-gateway, readOnly: true }
            - { name: state, mountPath: /var/lib/mcp-gateway }
            - { name: tmp, mountPath: /tmp }
            # Optional, for an aws_web_identity credential (token_file: /var/run/secrets/aws/token):
            # - { name: aws-token, mountPath: /var/run/secrets/aws, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: mcp-gateway-config
        - name: state            # audit log; lost on pod restart, so rely on mirror_stderr to your log pipeline
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        # Optional: projected token with the audience AWS STS expects.
        # - name: aws-token
        #   projected:
        #     sources:
        #       - serviceAccountToken:
        #           audience: sts.amazonaws.com
        #           expirationSeconds: 3600
        #           path: token
