# dev overlay: a local cluster (kind, kwok, minikube) with a locally built image.
#   docker build -t mcp-cloud-ops-gateway:dev . && kind load docker-image mcp-cloud-ops-gateway:dev
#   kubectl apply -k deploy/kubernetes/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: mcp-cloud-ops-gateway
    newName: mcp-cloud-ops-gateway
    newTag: dev
labels:
  - pairs:
      app.kubernetes.io/instance: mcp-gateway-dev
