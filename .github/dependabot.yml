# dependabot: keeps the pinned GitHub Actions (full commit SHAs) and the Go modules current.
# Pinning by SHA means nothing updates by itself; Dependabot proposes the new SHA and version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a hijacked or yanked release is
    # usually noticed before it reaches a pull request.
    cooldown:
      default-days: 7
    # One pull request for all action updates, not one per action.
    groups:
      github-actions:
        patterns: ['*']
    # "ci: ..." passes the Conventional Commits title check in pr-policy.
    commit-message:
      prefix: ci
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One pull request for all module updates, not one per module.
    groups:
      go-modules:
        patterns: ['*']
    # "build(deps): ..." passes the Conventional Commits title check in pr-policy.
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
