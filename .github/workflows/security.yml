# security: secret scanning, vulnerable-code scanning and dependency review.
#   secret-scan:       gitleaks over the full git history, on PRs, on main and weekly.
#   vulncheck:         govulncheck reports known vulnerabilities in code the gateway actually calls.
#   dependency-review: blocks a PR that adds a dependency with a known vulnerability.
# The job ids are required status check names in governance/policy.json; keep them in step.

name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly, so a rule or advisory added later still finds an old leak or a newly disclosed CVE.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

# A new push to a PR cancels the run it replaces; runs on main and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# gitleaks comes from its official release and must match the SHA-256 that release publishes.
# govulncheck is installed with go install; the Go toolchain verifies the module checksums.
# govulncheck v1.8.0 and later need Go 1.26; v1.7.0 is the newest that builds with the go.mod toolchain.
env:
  GITLEAKS_VERSION: '8.30.1'
  GOVULNCHECK_VERSION: 'v1.7.0'

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 fetches every commit: a secret that was added and then deleted is still a leak.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release tarball is checked against the SHA-256 the release publishes; a mismatch fails the job.
      - name: 'Tools: pinned gitleaks'
        run: |
          version="$GITLEAKS_VERSION"
          name="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name" "$base/$name"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks-checksums.txt" "$base/gitleaks_${version}_checksums.txt"
          (cd "$RUNNER_TEMP" && awk -v n="$name" '$2 == n' gitleaks-checksums.txt | sha256sum --check --strict -)
          tar -xzf "$RUNNER_TEMP/$name" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/gitleaks" version

      # --redact keeps the secret itself out of the log and the report; only rule, file and line show.
      - name: 'Scan: gitleaks, full history'
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          code=0
          gitleaks git . --config .gitleaks.toml --redact --no-banner --report-format json --report-path "$report" || code=$?
          {
            echo '### gitleaks'
            echo
            if [ "$code" -eq 0 ]; then
              echo 'No leaks found in the full history.'
            else
              echo 'Potential leak(s). Rotate the credential, then remove it from history.'
              echo
              echo '| Rule | File | Line | Commit |'
              echo '|---|---|---|---|'
              if [ -s "$report" ]; then
                python3 -c 'import json,sys; [print("| %s | %s | %s | %s |" % (l["RuleID"], l["File"], l["StartLine"], l["Commit"][:8])) for l in json.load(open(sys.argv[1]))]' "$report"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then echo "::error::gitleaks exited with code $code."; exit 1; fi

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A pinned version, not @latest. The Go module proxy and checksum database verify the download.
      - name: 'Tools: pinned govulncheck'
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Reports only vulnerabilities in functions the code can reach, so it fails on real exposure.
      - name: 'Scan: govulncheck'
        run: |
          code=0
          govulncheck ./... || code=$?
          {
            echo '### govulncheck'
            echo
            if [ "$code" -eq 0 ]; then echo 'No reachable known vulnerabilities.'; else echo "Vulnerabilities found (exit code $code): see the job log."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then echo "::error::govulncheck exited with code $code."; exit 1; fi

  dependency-review:
    name: dependency-review
    # Pull requests only: it compares the dependency graph of the base and the head.
    # The dependency graph is free on public repositories but needs GitHub Advanced Security on
    # private ones, so on a private repository the job is skipped. A skipped required check
    # counts as passed, so private repositories without Advanced Security are not blocked.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # comment-summary-in-pr stays off: commenting needs pull-requests: write, and the token
      # stays read-only. The result is in the job summary instead.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
