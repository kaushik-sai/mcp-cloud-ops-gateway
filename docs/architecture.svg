<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc" font-family="IBM Plex Sans, system-ui, Segoe UI, sans-serif">
  <title id="title">mcp-cloud-ops-gateway request pipeline</title>
  <desc id="desc">An agent calls a tool over MCP. The gateway identifies the caller, validates arguments, evaluates policy (allow, ask or deny), takes a human approval for ask, writes the audit log, leases short-lived credentials, runs the tool against Kubernetes, AWS, Azure or Terraform, then redacts and fences the output before returning it.</desc>
  <style>
    /* Colours from the Harness design system (tokens.css), light theme with a dark override. */
    .bg { fill: #f5f6f8; }
    .panel { fill: #ffffff; stroke: #d6dae1; stroke-width: 1.5; }
    .gw { fill: #e6ebfc; stroke: #2448d8; stroke-width: 1.5; }
    .ink { fill: #121820; }
    .muted { fill: #545e6c; }
    .accent { fill: #2448d8; }
    .line { stroke: #545e6c; stroke-width: 1.5; fill: none; }
    .allow { fill: #e3f3ea; stroke: #1d7a45; } .allow-t { fill: #1d7a45; }
    .ask { fill: #fbf0dc; stroke: #8f5400; } .ask-t { fill: #8f5400; }
    .deny { fill: #fce6e4; stroke: #b42318; } .deny-t { fill: #b42318; }
    .h { font-family: Archivo, Arial Narrow, system-ui, sans-serif; font-weight: 700; }
    .mono { font-family: JetBrains Mono, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1216; }
      .panel { fill: #171b21; stroke: #2c333d; }
      .gw { fill: #1a2340; stroke: #7c9bff; }
      .ink { fill: #e8ecf1; }
      .muted { fill: #9aa4b2; }
      .accent { fill: #7c9bff; }
      .line { stroke: #9aa4b2; }
      .allow { fill: #10261a; stroke: #4cc283; } .allow-t { fill: #4cc283; }
      .ask { fill: #2b1f0a; stroke: #e0a54a; } .ask-t { fill: #e0a54a; }
      .deny { fill: #2e1412; stroke: #f07466; } .deny-t { fill: #f07466; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="muted"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="560"/>

  <!-- Callers -->
  <rect class="panel" x="24" y="64" width="170" height="150" rx="8"/>
  <text class="ink h" x="40" y="92" font-size="16">Agents</text>
  <text class="muted" x="40" y="116" font-size="13">Claude Code (stdio)</text>
  <text class="muted" x="40" y="136" font-size="13">incident bot (HTTP)</text>
  <text class="muted" x="40" y="156" font-size="13">CI agent (HTTP)</text>
  <text class="muted mono" x="40" y="190" font-size="11">bearer token per agent</text>

  <rect class="panel" x="24" y="380" width="170" height="120" rx="8"/>
  <text class="ink h" x="40" y="408" font-size="16">Human approver</text>
  <text class="muted" x="40" y="432" font-size="13">admin API, own port,</text>
  <text class="muted" x="40" y="452" font-size="13">own token</text>
  <text class="muted mono" x="40" y="482" font-size="11">approvals approve apr_…</text>

  <!-- Gateway -->
  <rect class="gw" x="230" y="24" width="560" height="512" rx="14"/>
  <text class="accent h" x="250" y="54" font-size="18">mcp-cloud-ops-gateway</text>

  <g font-size="13">
    <rect class="panel" x="250" y="72" width="250" height="44" rx="8"/>
    <text class="ink" x="266" y="99">1  Identify the principal</text>
    <rect class="panel" x="250" y="128" width="250" height="44" rx="8"/>
    <text class="ink" x="266" y="155">2  Validate every argument</text>
    <rect class="panel" x="250" y="184" width="250" height="78" rx="8"/>
    <text class="ink" x="266" y="208">3  Evaluate policy</text>
    <rect class="allow" x="266" y="222" width="62" height="26" rx="13"/>
    <text class="allow-t" x="280" y="240" font-weight="600">allow</text>
    <rect class="ask" x="336" y="222" width="52" height="26" rx="13"/>
    <text class="ask-t" x="350" y="240" font-weight="600">ask</text>
    <rect class="deny" x="396" y="222" width="58" height="26" rx="13"/>
    <text class="deny-t" x="410" y="240" font-weight="600">deny</text>
    <rect class="ask" x="250" y="274" width="250" height="44" rx="8"/>
    <text class="ink" x="266" y="301">4  Approval: bound, single use</text>
    <rect class="panel" x="250" y="330" width="250" height="44" rx="8"/>
    <text class="ink" x="266" y="357">5  Audit decision (fail closed)</text>
    <rect class="panel" x="250" y="386" width="250" height="44" rx="8"/>
    <text class="ink" x="266" y="413">6  Lease short-lived credentials</text>
    <rect class="panel" x="250" y="442" width="250" height="44" rx="8"/>
    <text class="ink" x="266" y="469">7  Run tool (argv, no shell)</text>

    <rect class="panel" x="520" y="442" width="250" height="44" rx="8"/>
    <text class="ink" x="536" y="469">8  Redact, fence, cap output</text>
    <rect class="panel" x="520" y="386" width="250" height="44" rx="8"/>
    <text class="ink" x="536" y="413">9  Audit result, return to agent</text>

    <rect class="panel" x="520" y="72" width="250" height="110" rx="8"/>
    <text class="ink h" x="536" y="98" font-size="14">Config (one file per env)</text>
    <text class="muted" x="536" y="120">gateway.yaml + ${ENV} vars</text>
    <text class="muted" x="536" y="140">policy.yaml (profiles)</text>
    <text class="muted" x="536" y="160">credential adapters</text>

    <rect class="panel" x="520" y="200" width="250" height="110" rx="8"/>
    <text class="ink h" x="536" y="226" font-size="14">Audit log</text>
    <text class="muted" x="536" y="248">hash-chained JSON lines</text>
    <text class="muted" x="536" y="268">mirrored to stderr for a SIEM</text>
    <text class="muted mono" x="536" y="292" font-size="11">audit verify --file …</text>
  </g>

  <!-- Targets -->
  <rect class="panel" x="826" y="64" width="190" height="290" rx="8"/>
  <text class="ink h" x="842" y="92" font-size="16">Targets</text>
  <text class="ink" x="842" y="122" font-size="13">Kubernetes</text>
  <text class="muted" x="842" y="140" font-size="12">kubectl, RBAC hard limit</text>
  <text class="ink" x="842" y="172" font-size="13">AWS</text>
  <text class="muted" x="842" y="190" font-size="12">STS web identity, 15 min</text>
  <text class="ink" x="842" y="222" font-size="13">Azure</text>
  <text class="muted" x="842" y="240" font-size="12">Entra federation, ARM REST</text>
  <text class="ink" x="842" y="272" font-size="13">Terraform</text>
  <text class="muted" x="842" y="290" font-size="12">plan only, no state lock</text>
  <text class="muted" x="842" y="330" font-size="12">read role / write role</text>

  <rect class="panel" x="826" y="380" width="190" height="120" rx="8"/>
  <text class="ink h" x="842" y="408" font-size="16">Platform OIDC</text>
  <text class="muted" x="842" y="432" font-size="13">projected SA token or</text>
  <text class="muted" x="842" y="452" font-size="13">GitHub Actions OIDC</text>
  <text class="muted" x="842" y="482" font-size="12">no static cloud keys</text>

  <!-- Arrows -->
  <path class="line" d="M194 120 H250" marker-end="url(#arrow)"/>
  <path class="line" d="M194 440 C220 440 220 296 250 296" marker-end="url(#arrow)"/>
  <path class="line" d="M375 116 V128" marker-end="url(#arrow)"/>
  <path class="line" d="M375 172 V184" marker-end="url(#arrow)"/>
  <path class="line" d="M375 262 V274" marker-end="url(#arrow)"/>
  <path class="line" d="M375 318 V330" marker-end="url(#arrow)"/>
  <path class="line" d="M375 374 V386" marker-end="url(#arrow)"/>
  <path class="line" d="M375 430 V442" marker-end="url(#arrow)"/>
  <path class="line" d="M500 464 H520" marker-end="url(#arrow)"/>
  <path class="line" d="M645 442 V430" marker-end="url(#arrow)"/>
  <path class="line" d="M375 486 V516 H1028 V210 H1016" marker-end="url(#arrow)"/>
  <path class="line" d="M826 496 H510 V408 H500" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
  <path class="line" d="M645 386 V310" marker-end="url(#arrow)"/>
</svg>
